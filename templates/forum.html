{% extends "base.html" %}

{% block title %}Forum - Whack-a-Mole{% endblock %}

{% block content %}
<div id="forum-container">
    <h1>Whack-a-Mole Forum</h1>
    
    <div id="welcome-message">
        <h2>Welcome, {{ current_user.username }}!</h2>
    </div>
    
    <div id="announcements">
        <h2>Recent Highlights</h2>
        <ul id="highlights-list">
            <!-- Highlights will be dynamically added here -->
        </ul>
    </div>

    <div id="chat-container">
        <div id="chat-messages"></div>
        <button id="load-more-messages">Load More Messages</button>
        <div id="user-list">
            <h3>Online Users</h3>
            <ul id="online-users">
                <!-- Online users will be dynamically added here -->
            </ul>
        </div>
        <form id="chat-form">
            <input type="text" id="chat-input" placeholder="Type your message..." required>
            <button type="submit">Send</button>
        </form>
    </div>

    <div id="leaderboard-container">
        <h2>Leaderboard</h2>
        <div id="leaderboard-tabs">
            <button class="leaderboard-tab active" data-difficulty="easy">Easy</button>
            <button class="leaderboard-tab" data-difficulty="medium">Medium</button>
            <button class="leaderboard-tab" data-difficulty="hard">Hard</button>
        </div>
        <div id="leaderboard-content"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const leaderboardTabs = document.querySelectorAll('.leaderboard-tab');
    const leaderboardContent = document.getElementById('leaderboard-content');
    const highlightsList = document.getElementById('highlights-list');
    const onlineUsers = document.getElementById('online-users');
    const loadMoreMessagesButton = document.getElementById('load-more-messages');

    let lastMessageId = 0;
    const messagesPerPage = 20;

    // Server-Sent Events for real-time chat and updates
    const eventSource = new EventSource("{{ url_for('get_messages') }}");
    eventSource.onmessage = function(event) {
        const data = JSON.parse(event.data);
        if (Array.isArray(data)) {
            data.forEach(item => {
                if (item.type === 'chat') {
                    addChatMessage(item.message);
                } else if (item.type === 'highlight') {
                    addHighlight(item.highlight);
                } else if (item.type === 'users') {
                    updateOnlineUsers(item.users);
                }
            });
        }
    };

    function addChatMessage(message) {
        const messageElement = document.createElement('div');
        messageElement.className = 'chat-message';
        const timestamp = new Date(message.timestamp).toLocaleTimeString();
        messageElement.innerHTML = `
            <span class="chat-timestamp">[${timestamp}]</span>
            <strong class="chat-username">${message.username}:</strong> 
            <span class="chat-text">${message.message}</span>
        `;
        chatMessages.appendChild(messageElement);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        lastMessageId = Math.max(lastMessageId, message.id);
    }

    function addHighlight(highlight) {
        const highlightElement = document.createElement('li');
        highlightElement.textContent = highlight.highlight;
        highlightsList.appendChild(highlightElement);
    }

    function updateOnlineUsers(users) {
        onlineUsers.innerHTML = '';
        users.forEach(user => {
            const userElement = document.createElement('li');
            userElement.textContent = user;
            onlineUsers.appendChild(userElement);
        });
    }

    // Send chat message
    chatForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const message = chatInput.value.trim();
        if (message) {
            fetch("{{ url_for('send_message') }}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `message=${encodeURIComponent(message)}`
            }).then(response => response.json())
              .then(data => {
                  if (data.status === 'success') {
                      chatInput.value = '';
                      addChatMessage(data.message);
                  }
              })
              .catch(error => console.error('Error:', error));
        }
    });

    // Load more messages
    loadMoreMessagesButton.addEventListener('click', function() {
        fetch(`/get_more_messages?last_id=${lastMessageId}&limit=${messagesPerPage}`)
            .then(response => response.json())
            .then(data => {
                data.messages.reverse().forEach(message => {
                    const messageElement = document.createElement('div');
                    messageElement.className = 'chat-message';
                    const timestamp = new Date(message.timestamp).toLocaleTimeString();
                    messageElement.innerHTML = `
                        <span class="chat-timestamp">[${timestamp}]</span>
                        <strong class="chat-username">${message.username}:</strong> 
                        <span class="chat-text">${message.message}</span>
                    `;
                    chatMessages.insertBefore(messageElement, chatMessages.firstChild);
                    lastMessageId = Math.min(lastMessageId, message.id);
                });
                if (data.messages.length < messagesPerPage) {
                    loadMoreMessagesButton.style.display = 'none';
                }
            })
            .catch(error => console.error('Error:', error));
    });

    // Leaderboard functionality
    function loadLeaderboard(difficulty) {
        fetch(`/leaderboard/${difficulty}`)
            .then(response => response.json())
            .then(data => {
                let html = `<h3>${difficulty.charAt(0).toUpperCase() + difficulty.slice(1)} Mode</h3>
                            <table>
                                <tr>
                                    <th>Rank</th>
                                    <th>Player</th>
                                    <th>Score</th>
                                    <th>Date</th>
                                </tr>`;
                data.forEach((score, index) => {
                    html += `<tr>
                                <td>${index + 1}</td>
                                <td>${score.username}</td>
                                <td>${score.score}</td>
                                <td>${score.date}</td>
                            </tr>`;
                });
                html += '</table>';
                leaderboardContent.innerHTML = html;
            })
            .catch(error => console.error('Error:', error));
    }

    leaderboardTabs.forEach(tab => {
        tab.addEventListener('click', () => {
            const difficulty = tab.dataset.difficulty;
            loadLeaderboard(difficulty);
            leaderboardTabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
        });
    });

    // Load Easy leaderboard by default
    loadLeaderboard('easy');

    // Refresh leaderboard every 30 seconds
    function refreshLeaderboard() {
        const activeDifficulty = document.querySelector('.leaderboard-tab.active').dataset.difficulty;
        loadLeaderboard(activeDifficulty);
    }

    setInterval(refreshLeaderboard, 30000);
</script>
{% endblock %}
