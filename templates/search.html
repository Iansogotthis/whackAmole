
{% extends "base.html" %}
{% block content %}
<div class="search-container">
    <h2>Search Users</h2>
    <form method="GET" action="{{ url_for('search_users') }}">
        <input type="text" name="query" placeholder="Search by username..." value="{{ query if query }}">
        <button type="submit">Search</button>
    </form>
    
    {% if users %}
    <div class="search-results">
        {% for user in users %}
        <div class="user-card">
            <span>{{ user.username }}</span>
            {% if user != current_user %}
                <div class="emoji-reactions">
                    <button onclick="sendEmoji('{{ user.id }}', '🖐️')" title="High Five">🖐️</button>
                    <button onclick="sendEmoji('{{ user.id }}', '👊')" title="Fist Bump">👊</button>
                    <button onclick="sendEmoji('{{ user.id }}', '😉')" title="Wink">😉</button>
                    <button onclick="sendEmoji('{{ user.id }}', '😊')" title="Smile">😊</button>
                    <button onclick="sendEmoji('{{ user.id }}', '😢')" title="Sad">😢</button>
                </div>
                {% if user not in current_user.friends_list %}
                    <form action="{{ url_for('send_friend_request', user_id=user.id) }}" method="POST" style="display: inline;">
                        <button type="submit">Send Friend Request</button>
                    </form>
                {% else %}
                    <span>Already Friends</span>
                {% endif %}
            {% endif %}
        </div>
        {% endfor %}
    </div>
    {% endif %}
</div>

<script>
async function searchUsers(query) {
    try {
        const response = await fetch(`/search_users?query=${query}`, {
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        });
        if (!response.ok) throw new Error('Search failed');
        const results = await response.json();
        displayResults(results);
    } catch (error) {
        console.error('Search error:', error);
    }
}

function displayResults(results) {
    const resultsDiv = document.querySelector('.search-results');
    if (!results.length) {
        resultsDiv.innerHTML = '<p>No users found</p>';
        return;
    }
    resultsDiv.innerHTML = results.map(user => `
        <div class="user-card">
            <span>${user.username}</span>
            <div class="emoji-reactions">
                <button onclick="sendEmoji('${user.id}', '🖐️')">🖐️</button>
                <button onclick="sendEmoji('${user.id}', '👊')">👊</button>
                <button onclick="sendEmoji('${user.id}', '😉')">😉</button>
                <button onclick="sendEmoji('${user.id}', '😊')">😊</button>
                <button onclick="sendEmoji('${user.id}', '😢')">😢</button>
            </div>
            ${!user.is_friend ? 
                `<form action="/add_friend/${user.username}" method="POST" style="display: inline;">
                    <button type="submit">Send Friend Request</button>
                </form>` : 
                '<span>Already Friends</span>'
            }
        </div>
    `).join('');
}

function sendEmoji(userId, emoji) {
    fetch('/send_emoji', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            recipient_id: userId,
            emoji: emoji
        })
    });
}
</script>
{% endblock %}
