
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Friends - Whack-a-Mole</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="nav-container">
        <div class="nav-logo">
            <a href="{{ url_for('index') }}" class="logo-link">
                <div class="crosshair-container">
                    <img src="{{ url_for('static', filename='assets/mole.svg') }}" alt="Whack-a-Mole" class="logo-mole">
                    <div class="crosshair-horizontal"></div>
                    <div class="crosshair-vertical"></div>
                </div>
                <span class="logo-text">Whack-a-Mole</span>
            </a>
        </div>
        <div class="nav-toggle">Menu</div>
        <div class="nav-links">
            <a href="{{ url_for('index') }}">Game</a>
            <a href="{{ url_for('forum') }}">Forum</a>
            <a href="{{ url_for('search') }}">Search Players</a>
            <a href="{{ url_for('get_leaderboard', difficulty='easy') }}">Leaderboard</a>
            {% if current_user.is_authenticated %}
            <a href="{{ url_for('profile', username=current_user.username) }}">Profile</a>
            <a href="{{ url_for('chat') }}">Chat</a>
            <a href="{{ url_for('logout') }}">Logout</a>
            {% else %}
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('register') }}">Register</a>
            {% endif %}
        </div>
    </div>
    
    <main class="search-container">
        <h1>Find Friends</h1>
        <div class="search-box">
            <input type="text" id="userSearch" placeholder="Search for users..." oninput="searchUsers()">
        </div>
        
        <div id="searchResults" class="search-results"></div>
        
        <div class="friends-list-section">
            <h2>Your Friends</h2>
            <div id="friendsList" class="friends-feed"></div>
        </div>
    </main>

    <!-- User Profile Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalUsername"></h2>
            <div id="modalActions">
                <button id="friendRequestBtn" class="action-btn"></button>
                <button onclick="showEmojiModal()" class="action-btn">Send Greeting</button>
                <button class="close-btn">Back</button>
            </div>
        </div>
    </div>

    <!-- Emoji Modal -->
    <div id="emojiModal" class="modal">
        <div class="modal-content">
            <h3>Send a Greeting</h3>
            <div class="emoji-grid">
                <button onclick="sendEmoji('🖐️')" class="emoji-btn">🖐️ High Five</button>
                <button onclick="sendEmoji('👊')" class="emoji-btn">👊 Fist Bump</button>
                <button onclick="sendEmoji('😉')" class="emoji-btn">😉 Wink</button>
                <button onclick="sendEmoji('😊')" class="emoji-btn">😊 Smile</button>
            </div>
        </div>
    </div>

    <script>
        // Load friends list on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadFriendsList();
        });

        async function loadFriendsList() {
            const response = await fetch('/get_friends_list');
            const friends = await response.json();
            displayFriendsList(friends);
        }

        function displayFriendsList(friends) {
            const friendsList = document.getElementById('friendsList');
            friendsList.innerHTML = friends.map(friend => `
                <div class="friend-card">
                    <i class="fas fa-user-circle"></i>
                    <h3>${friend.username}</h3>
                </div>
            `).join('');
        }

        async function searchUsers() {
            const query = document.getElementById('userSearch').value;
            if (query.length < 2) return;

            const response = await fetch(`/search_users?query=${encodeURIComponent(query)}`);
            const users = await response.json();
            displaySearchResults(users);
        }

        function displaySearchResults(users) {
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = users.map(user => `
                <div class="friend-card">
                    <i class="fas fa-user-circle"></i>
                    <h3>${user.username}</h3>
                    <div class="friend-actions">
                        <button onclick="showUserModal('${user.username}')" class="action-btn">View Profile</button>
                    </div>
                </div>
            `).join('');
        }

        function showUserModal(username) {
            const modal = document.getElementById('userModal');
            document.getElementById('modalUsername').textContent = username;
            document.getElementById('friendRequestBtn').textContent = 'Send Friend Request';
            document.getElementById('friendRequestBtn').onclick = () => sendFriendRequest(username);
            modal.style.display = 'block';
        }

        function showEmojiModal() {
            document.getElementById('userModal').style.display = 'none';
            document.getElementById('emojiModal').style.display = 'block';
        }

        async function sendFriendRequest(username) {
            await fetch(`/add_friend/${username}`, { method: 'POST' });
            document.getElementById('userModal').style.display = 'none';
            loadFriendsList();
        }

        // Close modals when clicking outside
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }

        // Close button functionality
        document.querySelectorAll('.close, .close-btn').forEach(element => {
            element.onclick = function() {
                this.closest('.modal').style.display = 'none';
            }
        });
    </script>
</body>
</html>
