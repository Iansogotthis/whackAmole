{% extends "base.html" %}
{% block content %}
<div class="profile-main">
    <section class="profile-header">
        <h1>Find Friends</h1>
    </section>

    <div class="search-box">
        <input type="text" id="friend-search" placeholder="Search by username or email..." onkeyup="searchFriends(this.value)">
        <button onclick="searchFriends(document.getElementById('friend-search').value)">
            <i class="fas fa-search"></i>
        </button>
    </div>

    <div id="search-results" class="friends-grid"></div>
</div>

<script>
async function searchFriends(query) {
    if (query.length < 2) {
        document.getElementById('search-results').innerHTML = '';
        return;
    }

    try {
        const response = await fetch(`/find_friends?query=${encodeURIComponent(query)}`, {
            headers: {'X-Requested-With': 'XMLHttpRequest'}
        });
        const results = await response.json();
        displayResults(results);
    } catch (error) {
        console.error('Search error:', error);
    }
}

function displayResults(results) {
    const resultsDiv = document.getElementById('search-results');
    resultsDiv.innerHTML = results.map(user => `
        <div class="friend-card">
            <i class="fas fa-user-circle"></i>
            <h3>${user.username}</h3>
            <p>${user.email}</p>
            <p>Games played: ${user.games_played}</p>
            <div class="friend-actions">
                <button onclick="toggleFriend('${user.username}', this)" 
                        class="btn ${user.is_friend ? 'btn-danger' : 'btn-success'}">
                    ${user.is_friend ? 'Remove Friend' : 'Add Friend'}
                </button>
                ${user.is_friend ? `
                <div class="emoji-grid">
                    <button onclick="sendEmoji('${user.id}', '🖐️')" class="emoji-btn" title="High Five">🖐️</button>
                    <button onclick="sendEmoji('${user.id}', '👊')" class="emoji-btn" title="Fist Bump">👊</button>
                    <button onclick="sendEmoji('${user.id}', '😉')" class="emoji-btn" title="Wink">😉</button>
                    <button onclick="sendEmoji('${user.id}', '😊')" class="emoji-btn" title="Smile">😊</button>
                    <button onclick="sendEmoji('${user.id}', '😢')" class="emoji-btn" title="Sad">😢</button>
                </div>
                ` : ''}
            </div>
        </div>
    `).join('');
}

async function sendEmoji(userId, emoji) {
    try {
        const response = await fetch('/send_emoji', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                recipient_id: userId,
                emoji: emoji
            })
        });
        if (response.ok) {
            alert(`Sent ${emoji}!`);
        }
    } catch (error) {
        console.error('Error sending emoji:', error);
    }
}

async function toggleFriend(username, button) {
    const action = button.classList.contains('btn-danger') ? 'remove_friend' : 'add_friend';
    try {
        const response = await fetch(`/${action}/${username}`, {
            method: 'POST'
        });
        if (response.ok) {
            button.classList.toggle('btn-danger');
            button.classList.toggle('btn-success');
            button.textContent = button.classList.contains('btn-danger') ? 'Remove Friend' : 'Add Friend';

            if (action === 'add_friend') {
                const parent = button.parentElement;
                parent.innerHTML += `
                    <div class="emoji-grid">
                        <button onclick="sendEmoji('${username}', '🖐️')" class="emoji-btn" title="High Five">🖐️</button>
                        <button onclick="sendEmoji('${username}', '👊')" class="emoji-btn" title="Fist Bump">👊</button>
                        <button onclick="sendEmoji('${username}', '😉')" class="emoji-btn" title="Wink">😉</button>
                        <button onclick="sendEmoji('${username}', '😊')" class="emoji-btn" title="Smile">😊</button>
                        <button onclick="sendEmoji('${username}', '😢')" class="emoji-btn" title="Sad">😢</button>
                    </div>
                `;
            }
        }
    } catch (error) {
        console.error('Error:', error);
    }
}
</script>
{% endblock %}
