
{% extends "base.html" %}
{% block content %}
<div class="find-friends-container">
    <h1>Find Friends</h1>
    <div class="search-box">
        <input type="text" id="friend-search" placeholder="Search by username or email..." onkeyup="searchFriends(this.value)">
        <button onclick="searchFriends(document.getElementById('friend-search').value)">
            <i class="fas fa-search"></i>
        </button>
    </div>
    
    <div id="search-results" class="search-results"></div>
</div>

<style>
.find-friends-container {
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
}

.search-box {
    display: flex;
    gap: 10px;
    margin: 20px 0;
}

.search-box input {
    flex: 1;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 16px;
}

.search-box button {
    padding: 12px 24px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.search-results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.user-card {
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    transition: transform 0.2s;
}

.user-card:hover {
    transform: translateY(-2px);
}

.friend-button {
    width: 100%;
    padding: 8px;
    margin-top: 10px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background: #4CAF50;
    color: white;
}

.friend-button.remove {
    background: #f44336;
}
</style>

<script>
async function searchFriends(query) {
    if (query.length < 2) {
        document.getElementById('search-results').innerHTML = '';
        return;
    }
    
    try {
        const response = await fetch(`/find_friends?query=${encodeURIComponent(query)}`, {
            headers: {'X-Requested-With': 'XMLHttpRequest'}
        });
        const results = await response.json();
        displayResults(results);
    } catch (error) {
        console.error('Search error:', error);
    }
}

function displayResults(results) {
    const resultsDiv = document.getElementById('search-results');
    resultsDiv.innerHTML = results.map(user => `
        <div class="user-card">
            <h3>${user.username}</h3>
            <p>${user.email}</p>
            <p>Games played: ${user.games_played}</p>
            <button onclick="toggleFriend('${user.username}', this)" 
                    class="friend-button ${user.is_friend ? 'remove' : 'add'}">
                ${user.is_friend ? 'Remove Friend' : 'Add Friend'}
            </button>
        </div>
    `).join('');
}

async function toggleFriend(username, button) {
    const action = button.classList.contains('remove') ? 'remove_friend' : 'add_friend';
    try {
        const response = await fetch(`/${action}/${username}`, {
            method: 'POST'
        });
        if (response.ok) {
            button.classList.toggle('remove');
            button.classList.toggle('add');
            button.textContent = button.classList.contains('remove') ? 'Remove Friend' : 'Add Friend';
        }
    } catch (error) {
        console.error('Error:', error);
    }
}
</script>
{% endblock %}
