
{% extends "base.html" %}
{% block content %}
<div class="profile-main">
    <h1>Find Friends</h1>

    <script src="https://replit.com/public/js/repl-auth-v2.js" crossorigin="anonymous"></script>

    <!-- Search Section -->
    <div class="search-section">
        <input type="text" id="searchInput" placeholder="Search by username..." 
               oninput="debounceSearch(this.value)">
    </div>

    <!-- Search Results -->
    <div id="searchResults" class="search-results"></div>

    <!-- Friends List -->
    <div class="friends-section">
        <h2>My Friends</h2>
        <div id="friendsList" class="friends-list"></div>
    </div>
</div>

<script>
let debounceTimeout;

const authToken = window.ReplitBridge ? await window.ReplitBridge.getToken() : null;

function debounceSearch(query) {
    clearTimeout(debounceTimeout);
    debounceTimeout = setTimeout(() => performSearch(query), 300);
}

async function performSearch(query) {
    if (query.length < 2) {
        document.getElementById('searchResults').innerHTML = '';
        return;
    }

    try {
        const response = await fetch(`/search_users?query=${encodeURIComponent(query)}`, {
            headers: {
                'Authorization': `Bearer ${authToken}`
            }
        });
        const users = await response.json();

        document.getElementById('searchResults').innerHTML = users.map(user => `
            <div class="user-card">
                <div class="user-info">
                    <span class="username">${user.username}</span>
                    <span class="email">${user.email}</span>
                </div>
                <button onclick="addFriend('${user.username}')" class="add-friend-btn">
                    Add Friend
                </button>
            </div>
        `).join('');
    } catch (error) {
        console.error('Search failed:', error);
    }
}

async function addFriend(username) {
    try {
        const response = await fetch(`/add_friend/${username}`, { 
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${authToken}`
            }
        });

        if (response.ok) {
            loadFriends();
            alert(`Friend request sent to ${username}`);
        }
    } catch (error) {
        console.error('Failed to add friend:', error);
    }
}

async function loadFriends() {
    try {
        const response = await fetch('/get_friends_list', {
            headers: {
                'Authorization': `Bearer ${authToken}`
            }
        });
        const friends = await response.json();

        document.getElementById('friendsList').innerHTML = friends.map(friend => `
            <div class="friend-card">
                <span class="friend-name">${friend.username}</span>
                <div class="friend-actions">
                    <button onclick="location.href='/profile/${friend.username}'">
                        Profile
                    </button>
                    <button onclick="location.href='/chat/${friend.id}'">
                        Chat
                    </button>
                </div>
            </div>
        `).join('');
    } catch (error) {
        console.error('Failed to load friends:', error);
    }
}

// Load friends on page load
document.addEventListener('DOMContentLoaded', loadFriends);
</script>

<style>
.search-section {
    margin: 20px 0;
}

#searchInput {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
}

.user-card, .friend-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    margin: 5px 0;
    background: #f5f5f5;
    border-radius: 4px;
}

.user-info {
    display: flex;
    flex-direction: column;
}

.username {
    font-weight: bold;
}

.email {
    color: #666;
    font-size: 0.9em;
}

.friend-actions {
    display: flex;
    gap: 10px;
}

button {
    padding: 5px 15px;
    border: none;
    border-radius: 4px;
    background: #0066cc;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #0052a3;
}
</style>
{% endblock %}
