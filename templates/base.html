<div class="nav-container">
    <div class="nav-logo">
        <div class="crosshair">
            <img src="{{ url_for('static', filename='assets/mole.svg') }}" alt="Whack-a-Mole" class="logo-mole">
        </div>
    </div>
    <div class="nav-toggle">Menu</div>
    <div class="nav-links">
        <a href="{{ url_for('index') }}">Game</a>
        <a href="{{ url_for('forum') }}">Forum</a>
        <a href="{{ url_for('find_friends') }}">Search</a>
        <a href="{{ url_for('get_leaderboard', difficulty='easy') }}">Leaderboard</a>
        {% if current_user.is_authenticated %}
        <a href="{{ url_for('profile', username=current_user.username) }}">Profile</a>
        <a href="{{ url_for('chat') }}">Chat</a>
        <a href="{{ url_for('logout') }}">Logout</a>
        {% else %}
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('register') }}">Register</a>
        {% endif %}
    </div>
</div>
<script>
      document.addEventListener('DOMContentLoaded', function() {
        window.addEventListener('message', function(event) {
          if (event.origin === 'https://replit.com' && event.data === 'auth_complete') {
            window.location.reload();
          }
        });
      });
    </script>
    <script src="https://replit.com/public/js/repl-auth-v2.js" crossorigin="anonymous"></script>
